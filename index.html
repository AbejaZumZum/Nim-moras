<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nim: Ramitas de Mora</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: #f4eee0;
      color: #3e2723;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .game-container {
      background: #ebdccb;
      border: 2px solid #8d6e63;
      border-radius: 16px;
      padding: 16px 12px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(62, 39, 35, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 1.3rem;
      text-align: center;
      color: #3e2723;
    }

    .rules {
      font-size: 0.75rem;
      text-align: center;
      color: #5d4037;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .status-msg {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2e7d32;
      min-height: 1.4em;
      margin-bottom: 8px;
      text-align: center;
    }

    /* Pirámide de ramitas */
    .pyramid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1px;
      width: 100%;
    }

    .twig {
      cursor: pointer;
      width: 22px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .twig svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Estado seleccionado: Rayita cyan horizontal */
    .twig.selected svg .selection-line {
      display: block !important;
    }

    /* Estado tachado/apagado */
    .twig.taken {
      cursor: default;
      opacity: 0.25;
      filter: grayscale(100%) brightness(40%);
    }

    .twig.taken svg .selection-line {
      display: none !important;
    }

    /* Panel de Botones Compacto */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: bold;
      background-color: #a1887f;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background 0.2s;
    }

    .btn-main:active {
      background-color: #8d6e63;
      transform: translateY(1px);
    }

    .btn-main:disabled {
      background-color: #d7ccc8;
      color: #a1887f;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Fila de controles secundarios (3 en línea) */
    .sub-controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .btn-sub, .select-sub {
      width: 100%;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-family: inherit;
      font-weight: bold;
      background-color: #f5f0eb;
      color: #4e342e;
      border: 1px solid #bcaaa4;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .select-sub {
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%234e342e" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 4px center;
      padding-right: 14px;
    }

    .btn-sub:active, .select-sub:active {
      background-color: #e0d7ce;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>Nim: Ramitas de Mora</h1>
  <div class="rules">
    Tacha cualquier cantidad de ramitas en un solo renglón por turno.<br>
    ¡Quien se quede con la última ramita <strong>pierde</strong>!
  </div>

  <div id="status" class="status-msg">Tu turno. Elige ramas a tachar.</div>

  <div id="pyramid" class="pyramid"></div>

  <div class="controls">
    <button id="confirm-btn" class="btn-main" onclick="confirmMove()">Confirmar jugada</button>
    
    <div class="sub-controls">
      <button class="btn-sub" onclick="resetGame()">🔄 Reiniciar</button>
      
      <select id="difficulty" class="select-sub" onchange="changeDifficulty(this.value)">
        <option value="easy">🌱 Aprendiz</option>
        <option value="medium">🌿 Sabio</option>
        <option value="hard" selected>🌳 Leyenda</option>
      </select>

      <button id="music-btn" class="btn-sub" onclick="toggleMusic()">🎵 OFF</button>
    </div>
  </div>
</div>

<script>
  let gameState = [];
  let selectedRow = -1;
  let selectedIndices = [];
  let isPlayerTurn = true;
  let difficulty = 'hard';
  let musicPlaying = false;
  let synth, loop;

  // SVG con DOS MORAS y ramita leñosa corregida
  function createTwigSVG() {
    return `
      <svg viewBox="0 0 30 50" xmlns="http://www.w3.org/2000/svg">
        <!-- Tallo leñoso -->
        <path d="M 14,48 L 16,35 L 13,22 L 15,6" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M 15,48 L 17,35 L 14,22 L 16,6" stroke="#2d1c18" stroke-width="1" stroke-linecap="round" fill="none"/>
        
        <!-- Espinas -->
        <path d="M 16,38 L 22,35 L 17,33 Z" fill="#3e2723"/>
        <path d="M 13,28 L 7,25 L 12,23 Z" fill="#3e2723"/>

        <!-- Hoja verde -->
        <path d="M 13,24 C 3,21 3,12 14,16 C 14,16 12,21 13,24 Z" fill="#2e7d32" stroke="#1b5e20" stroke-width="0.8"/>
        <path d="M 13,24 Q 8,19 11,14" stroke="#81c784" stroke-width="0.5" fill="none"/>

        <!-- MORA SUPERIOR -->
        <g transform="translate(15, 2)">
          <circle cx="0" cy="0" r="2.2" fill="#211029"/>
          <circle cx="-2" cy="2.5" r="2" fill="#311b92"/>
          <circle cx="2" cy="2.5" r="2" fill="#1a237e"/>
          <circle cx="0" cy="4.5" r="2.2" fill="#4a148c"/>
          <circle cx="-1.5" cy="7" r="1.8" fill="#211029"/>
          <circle cx="1.5" cy="7" r="1.8" fill="#311b92"/>
          <circle cx="0" cy="9" r="1.5" fill="#1a237e"/>
        </g>

        <!-- SEGUNDA MORA (Media altura) -->
        <g transform="translate(19, 18)">
          <path d="M -4,2 L 0,-1" stroke="#3e2723" stroke-width="1.2" fill="none"/>
          <circle cx="0" cy="0" r="1.8" fill="#311b92"/>
          <circle cx="-1.8" cy="2" r="1.6" fill="#211029"/>
          <circle cx="1.8" cy="2" r="1.6" fill="#4a148c"/>
          <circle cx="0" cy="3.5" r="1.8" fill="#1a237e"/>
          <circle cx="-1.2" cy="5.5" r="1.4" fill="#311b92"/>
          <circle cx="1.2" cy="5.5" r="1.4" fill="#211029"/>
          <circle cx="0" cy="7" r="1.2" fill="#4a148c"/>
        </g>

        <!-- Rayita horizontal Cyan para selección -->
        <line class="selection-line" x1="1" y1="25" x2="29" y2="25" stroke="#00bcd4" stroke-width="4.5" stroke-linecap="round" style="display:none;" />
      </svg>
    `;
  }

  function initBoard() {
    gameState = [];
    for (let r = 1; r <= 10; r++) {
      gameState.push(r);
    }
    selectedRow = -1;
    selectedIndices = [];
    isPlayerTurn = true;
    document.getElementById('confirm-btn').disabled = false;
    updateStatus("Tu turno. Elige ramas a tachar.");
    renderPyramid();
  }

  function renderPyramid() {
    const container = document.getElementById('pyramid');
    container.innerHTML = '';

    for (let r = 0; r < 10; r++) {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';

      for (let c = 0; c < r + 1; c++) {
        const twig = document.createElement('div');
        twig.className = 'twig';
        twig.innerHTML = createTwigSVG();

        const isTaken = c >= gameState[r];
        const isSelected = (selectedRow === r && selectedIndices.includes(c));

        if (isTaken) {
          twig.classList.add('taken');
        } else {
          if (isSelected) {
            twig.classList.add('selected');
          }
          twig.onclick = () => handleTwigClick(r, c);
        }
        rowDiv.appendChild(twig);
      }
      container.appendChild(rowDiv);
    }
  }

  function handleTwigClick(r, c) {
    if (!isPlayerTurn) return;

    if (selectedRow !== -1 && selectedRow !== r) {
      selectedIndices = [];
    }

    selectedRow = r;
    const indexPos = selectedIndices.indexOf(c);
    if (indexPos > -1) {
      selectedIndices.splice(indexPos, 1);
      if (selectedIndices.length === 0) selectedRow = -1;
    } else {
      selectedIndices.push(c);
    }

    renderPyramid();
  }

  function confirmMove() {
    if (!isPlayerTurn || selectedIndices.length === 0) return;

    gameState[selectedRow] -= selectedIndices.length;
    selectedRow = -1;
    selectedIndices = [];

    renderPyramid();

    if (checkGameOver()) return;

    isPlayerTurn = false;
    document.getElementById('confirm-btn').disabled = true;
    updateStatus("Pensando jugada la IA...");
    setTimeout(aiTurn, 700);
  }

  function aiTurn() {
    let move = getAIMove();
    gameState[move.row] -= move.count;

    renderPyramid();

    if (checkGameOver()) return;

    isPlayerTurn = true;
    document.getElementById('confirm-btn').disabled = false;
    updateStatus("Tu turno. Elige ramas a tachar.");
  }

  function getAIMove() {
    let activeRows = [];
    for (let i = 0; i < 10; i++) {
      if (gameState[i] > 0) activeRows.push(i);
    }

    let rowsWithMoreThanOne = activeRows.filter(r => gameState[r] > 1);
    let bestMove = null;

    if (rowsWithMoreThanOne.length === 0) {
      let r = activeRows[0];
      bestMove = { row: r, count: 1 };
    } else if (rowsWithMoreThanOne.length === 1) {
      let targetRow = rowsWithMoreThanOne[0];
      let oddCount = (activeRows.length - 1) % 2 !== 0;
      let leave = oddCount ? 1 : 0;
      let remove = gameState[targetRow] - leave;
      if (remove <= 0) remove = 1;
      bestMove = { row: targetRow, count: remove };
    } else {
      let xorSum = 0;
      for (let i = 0; i < 10; i++) xorSum ^= gameState[i];

      if (xorSum !== 0) {
        for (let i = 0; i < 10; i++) {
          let target = gameState[i] ^ xorSum;
          if (target < gameState[i]) {
            bestMove = { row: i, count: gameState[i] - target };
            break;
          }
        }
      }
    }

    if (difficulty === 'easy' && Math.random() < 0.7) bestMove = null;
    if (difficulty === 'medium' && Math.random() < 0.35) bestMove = null;

    if (!bestMove) {
      let r = activeRows[Math.floor(Math.random() * activeRows.length)];
      let count = Math.floor(Math.random() * gameState[r]) + 1;
      bestMove = { row: r, count: count };
    }

    return bestMove;
  }

  function checkGameOver() {
    let totalLeft = gameState.reduce((a, b) => a + b, 0);

    if (totalLeft === 1) {
      if (isPlayerTurn) {
        updateStatus("🎉 ¡Ganaste! La IA se quedó con la última ramita.");
      } else {
        updateStatus("💀 Perdiste. Te quedó la última ramita.");
      }
      document.getElementById('confirm-btn').disabled = true;
      return true;
    } else if (totalLeft === 0) {
      if (isPlayerTurn) {
        updateStatus("💀 Perdiste. Tomaste la última ramita.");
      } else {
        updateStatus("🎉 ¡Ganaste! La IA tomó la última ramita.");
      }
      document.getElementById('confirm-btn').disabled = true;
      return true;
    }
    return false;
  }

  function updateStatus(msg) {
    document.getElementById('status').innerHTML = msg;
  }

  function resetGame() {
    initBoard();
  }

  function changeDifficulty(val) {
    difficulty = val;
  }

  async function toggleMusic() {
    const btn = document.getElementById('music-btn');
    if (!musicPlaying) {
      await Tone.start();
      
      const reverb = new Tone.Reverb({ decay: 4, wet: 0.5 }).toDestination();
      synth = new Tone.PluckSynth({
        attackNoise: 1.5,
        dampening: 4000,
        resonance: 0.9
      }).connect(reverb);

      const scale = ["C4", "D4", "F4", "G4", "A4", "C5", "D5"];
      
      loop = new Tone.Loop(time => {
        if (Math.random() > 0.2) {
          let note = scale[Math.floor(Math.random() * scale.length)];
          synth.triggerAttack(note, time);
        }
      }, "8n").start(0);

      Tone.Transport.bpm.value = 75;
      Tone.Transport.start();

      musicPlaying = true;
      btn.innerHTML = "🎵 ON";
    } else {
      Tone.Transport.stop();
      if (loop) loop.dispose();
      musicPlaying = false;
      btn.innerHTML = "🎵 OFF";
    }
  }

  initBoard();
</script>
</body>
</html>
